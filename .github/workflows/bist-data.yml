name: BIST kapanışları

on:
  schedule:
    # Hafta içi 18:25 (İstanbul, UTC+3): kapanış + Yahoo'nun 15 dk gecikmesi sonrası.
    # 20:00'deki ikinci çalıştırma, ilkinde eksik/gecikmeli gelen veriyi tamamlar.
    - cron: "25 15 * * 1-5"
    - cron: "0 17 * * 1-5"
  workflow_dispatch:
  push:
    paths:
      - scripts/fetch_bist.py
      - .github/workflows/bist-data.yml

permissions:
  contents: write

concurrency:
  group: bist-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "yfinance>=0.2.54"
      - run: python scripts/fetch_bist.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bist.json
          if git diff --cached --quiet; then echo "değişiklik yok"; exit 0; fi
          git commit -m "BIST kapanışlarını güncelle"
          git push
